<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Russell Home Roasting — Roast Record Lookup</title>
  <link rel="stylesheet" href="rhr.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css" />
  <link rel="stylesheet" href="origin-map.css" />
  <style>
    /* ── Hero ── */
    .hero{
      border: 1px solid var(--fg, #0e0d0b);
      outline: 1px solid var(--fg, #0e0d0b);
      outline-offset: -6px;
      background: var(--bg, #f7f5f0);
      padding: 34px 36px 26px;
      margin-bottom: 28px;
    }
    .hero-eyebrow{
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted, #7a7670);
    }
    .hero-title{
      font-family: "Special Elite", Georgia, serif;
      font-weight: normal;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.05;
      margin: 20px 0 8px;
      color: var(--fg, #0e0d0b);
    }
    .hero-region{
      font-family: Georgia, "Times New Roman", Times, serif;
      font-style: italic; font-size: 1.2rem;
      color: var(--fg, #0e0d0b);
    }
    .hero-loc{
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 0.92rem; color: var(--muted, #7a7670); margin-top: 2px;
    }
    .hero-chips{ display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }
    .hero-chip{
      border: 1px solid var(--fg, #0e0d0b);
      padding: 6px 13px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--fg, #0e0d0b);
    }
    .hero-stats{
      display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px;
      margin-top: 28px; border-top: 1px solid var(--soft, #dedad2);
    }
    .hero-stat{ padding: 14px 0; border-bottom: 1px solid var(--soft, #dedad2); }
    .hero-stat.full{ grid-column: 1 / -1; }
    .hero-stat-label{
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted, #7a7670); margin-bottom: 4px;
    }
    .hero-stat-value{
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1.02rem; color: var(--fg, #0e0d0b);
    }
    @media (max-width: 560px){
      .hero{ padding: 26px 22px 18px; }
      .hero-stats{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <aside class="rail" aria-hidden="true">
    <div class="rail-dot"></div>
    <div class="rail-text"> · Estd 2026 · </div>
    <div class="rail-dot"></div>
  </aside>

  <main class="page">
    <div class="content">

      <header>
        <h1 class="brand">
          Russell Home Roasting
          <span>Roast Record Lookup</span>
        </h1>
      </header>

      <div class="body-grid">

        <div class="main-panel">

          <section class="lookup" aria-labelledby="lookup-title">
            <div class="lookup-label" id="lookup-title">Enter Batch Number</div>
            <div class="lookup-help">Enter the batch number printed on the bag.</div>
            <form id="lookup-form" class="lookup-row" autocomplete="off">
              <input id="batch-input" name="batch" type="text" placeholder="e.g. EKM426519" aria-label="Batch number" />
              <button type="submit">View Record</button>
            </form>
          </section>

          <section id="result" aria-live="polite"></section>

        </div>

        <nav class="side-nav" aria-label="Main navigation">
          <a href="journal.html">Journal</a>
          <a href="coffee.html">Coffee</a>
          <a href="batch-lookup.html" class="active">Batches</a>
          <!--<a href="order.html">Order</a>-->
          <a href="about.html">About</a>
          <a href="index.html">Home</a>
        </nav>

      </div>

      <footer>
        <span>Russell Home Roasting · Appleton, WI</span>
        <span>built by hand, like the coffee</span>
      </footer>

    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js"></script>
  <script src="origin-map.js"></script>
  <script>
    // ---- Coffee details (same Gist as coffee.html) ----
    const GIST_ID = '483d480b06dbd04810597ddb55db492e';
    const HIDDEN_FIELDS = ['price', 'prefix'];   // never shown (matched at any nesting level)

    let originsPromise = null;
    function loadOrigins() {
      if (!originsPromise) {
        originsPromise = fetch('https://api.github.com/gists/' + GIST_ID)
          .then(r => { if (!r.ok) throw new Error('Gist fetch failed'); return r.json(); })
          .then(gist => {
            // In-stock list is required; archive (out-of-stock) is optional
            const inStock = JSON.parse(gist.files['origins.json'].content);
            let archived = [];
            try {
              const file = gist.files['origins-archive.json'];
              if (file) archived = JSON.parse(file.content);
            } catch (e) { /* bad or missing archive shouldn't break lookups */ }
            return [...inStock, ...(Array.isArray(archived) ? archived : [])];
          })
          .catch(() => { originsPromise = null; return null; }); // retry on next lookup
      }
      return originsPromise;
    }

    // Find the coffee whose 3-letter prefix starts the batch number
    function findCoffee(origins, batch) {
      if (!Array.isArray(origins)) return null;
      return origins.find(o => o.prefix && batch.startsWith(String(o.prefix).toUpperCase())) || null;
    }

    function stripHidden(value) {
      if (Array.isArray(value)) return value.map(stripHidden);
      if (value && typeof value === 'object') {
        return Object.fromEntries(
          Object.entries(value)
            .filter(([k]) => !HIDDEN_FIELDS.includes(k.toLowerCase()))
            .map(([k, v]) => [k, stripHidden(v)])
        );
      }
      return value;
    }

    // ---- Farm map (shared code lives in origin-map.js) ----
    let batchMap = null;
    function renderMap(coffee) {
      if (batchMap) { batchMap.remove(); batchMap = null; }
      batchMap = OriginMap.render(document.getElementById('origin-map'), coffee);
    }

    // Roast data is required; coffee details are a bonus (record still shows if the Gist is down)
    async function fetchBatch(batch) {
      const [roastRes, origins] = await Promise.all([
        fetch(`data/${batch}.json`),
        loadOrigins()
      ]);
      if (!roastRes.ok) throw new Error('Batch not found');
      const roast = await roastRes.json();
      const match = findCoffee(origins, batch);
      return { roast, coffee: match ? stripHidden(match) : null };
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    const LABEL_OVERRIDES = { flavor: 'Flavor Notes', cultivar: 'Cultivar', subregion: 'Subregion' };

    function prettyLabel(key) {
      if (LABEL_OVERRIDES[key]) return LABEL_OVERRIDES[key];
      return key.replace(/[_-]+/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/^./, c => c.toUpperCase());
    }

    function flatValue(v) {
      if (Array.isArray(v)) return v.map(flatValue).join(', ');
      if (v && typeof v === 'object') {
        return Object.entries(v).map(([k, x]) => `${prettyLabel(k)}: ${flatValue(x)}`).join('; ');
      }
      return esc(v);
    }

    // Generic renderer: top-level values become a "Coffee" section,
    // each top-level object (origin, brewing, ...) becomes its own section.
    function renderCoffee(coffee, exclude = []) {
      if (!coffee) return '';
      const entries = Object.entries(coffee).filter(([k, v]) => !exclude.includes(k) && !OriginMap.COORD_KEYS.includes(k.toLowerCase()) && v != null && v !== '');
      const isGroup = v => v && typeof v === 'object' && !Array.isArray(v);

      const simple = entries.filter(([, v]) => !isGroup(v));
      const groups = entries.filter(([, v]) => isGroup(v));

      const toRows = list => renderRows(list.map(([k, v]) => ({ label: prettyLabel(k), value: flatValue(v) })));

      let html = '';
      if (simple.length) {
        html += `<section><div class="section-title">More About This Coffee</div>${toRows(simple)}</section>`;
      }
      for (const [key, obj] of groups) {
        const rows = Object.entries(obj).filter(([k, v]) => !OriginMap.COORD_KEYS.includes(k.toLowerCase()) && v != null && v !== '');
        if (rows.length) {
          html += `<section><div class="section-title">${esc(prettyLabel(key))}</div>${toRows(rows)}</section>`;
        }
      }
      return html;
    }

    const resultEl = document.getElementById('result');
    const form = document.getElementById('lookup-form');
    const input = document.getElementById('batch-input');

    function normalizeBatch(value) {
      return value.trim().toUpperCase();
    }

    function formatDate(isoDate) {
      const date = new Date(isoDate + 'T00:00:00');
      return date.toLocaleDateString(undefined, {
        year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    function secondsToMinSec(total) {
      const s = Math.round(total);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function renderRows(rows) {
      return `<div class="rows">${rows.map(r => `
        <div class="row">
          <div class="row-label">${r.label}</div>
          <div class="row-value">${r.value}</div>
        </div>`).join('')}
      </div>`;
    }

    function renderChart(timex, temp2, timeindex, computed) {
      const chargeIdx = timeindex[0];
      const dropIdx   = timeindex[6];
      const totalTime = computed.totaltime;
      const dryTime   = computed.DRY_time;
      const tpTime    = computed.TP_time;
      const fcsTime   = computed.FCs_time;
      const fceTime   = computed.FCe_time;

      // Build points relative to charge
      const chargeT = timex[chargeIdx];
      const points = [];
      for (let i = chargeIdx; i <= dropIdx && i < timex.length; i++) {
        const t  = timex[i] - chargeT;
        const bt = temp2[i];
        if (bt != null && bt > 0) points.push({ t, bt });
      }

      if (!points.length) return '<div class="empty-state">No roast curve data available.</div>';

      // Smooth: sliding window average
      const windowSize = 10;
      const drawPoints = points.map((p, i) => {
        const start = Math.max(0, i - Math.floor(windowSize / 2));
        const end   = Math.min(points.length, start + windowSize);
        const slice = points.slice(start, end);
        return { t: p.t, bt: slice.reduce((s, v) => s + v.bt, 0) / slice.length };
      });

      const width = 700, height = 300;
      const pad = { top: 28, right: 52, bottom: 36, left: 42 };
      const maxX = totalTime;
      const bts  = drawPoints.map(p => p.bt);
      const minY = Math.floor((Math.min(...bts) - 20) / 25) * 25;
      const maxY = Math.ceil((Math.max(...bts) + 10) / 25) * 25;
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const x = t    => pad.left + (t / maxX) * innerW;
      const y = temp => pad.top  + (1 - ((temp - minY) / (maxY - minY || 1))) * innerH;
      const bot = pad.top + innerH;

      // Compute RoR (°F/min) from smoothed BT, then smooth the RoR itself
      const rorRaw = drawPoints.map((p, i) => {
        if (i === 0) return { t: p.t, ror: 0 };
        const prev = drawPoints[i - 1];
        const dt = (p.t - prev.t) / 60; // convert seconds to minutes
        return { t: p.t, ror: dt > 0 ? (p.bt - prev.bt) / dt : 0 };
      });
      const rorWindowSize = 400;
      const rorPoints = rorRaw.map((p, i) => {
        const start = Math.max(0, i - Math.floor(rorWindowSize / 2));
        const end   = Math.min(rorRaw.length, start + rorWindowSize);
        const slice = rorRaw.slice(start, end);
        return { t: p.t, ror: slice.reduce((s, v) => s + v.ror, 0) / slice.length };
      });

      // RoR axis: 0 to ~25 °F/min, right side
      const rorMax = 25;
      const rorMin = 0;
      const yRor = ror => pad.top + (1 - ((ror - rorMin) / (rorMax - rorMin))) * innerH;
      const rorPath = rorPoints.map((p, i) =>
        `${i === 0 ? 'M' : 'L'} ${x(p.t).toFixed(2)} ${yRor(Math.max(rorMin, Math.min(rorMax, p.ror))).toFixed(2)}`
      ).join(' ');
      const rorTicks = [0, 5, 10, 15, 20, 25];

      const path = drawPoints.map((p, i) =>
        `${i === 0 ? 'M' : 'L'} ${x(p.t).toFixed(2)} ${y(p.bt).toFixed(2)}`
      ).join(' ');

      const yTicks = [];
      for (let v = minY; v <= maxY; v += 50) yTicks.push(v);
      const xTicks = [];
      const xStep = maxX <= 480 ? 60 : 120;
      for (let v = 0; v <= maxX; v += xStep) xTicks.push(v);
      if (xTicks[xTicks.length - 1] !== maxX) xTicks.push(maxX);

      // Phase shading: Drying (0→dry), Maillard (dry→FCs), Development (FCs→drop)
      // Colours are translucent fills using CSS-friendly rgba strings
      const phases = [
        { start: 0,       end: dryTime, color: 'rgba(180,160,120,0.08)', label: 'Drying',      labelPos: 'start' },
        { start: dryTime, end: fcsTime, color: 'rgba(140,100, 60,0.08)', label: 'Maillard',    labelPos: 'start' },
        { start: fcsTime, end: totalTime,color:'rgba( 80, 50, 20,0.10)', label: 'Development', labelPos: 'start' },
      ].filter(p => p.start != null && p.end != null && p.end > p.start);

      // Vertical marker lines
      const vLines = [
        { t: 0,         label: 'Charge',          dash: 'none', offset: 6   },
        { t: tpTime,    label: 'TP',   dash: '3 3',  offset: 6   },
        { t: dryTime,   label: 'DE',         dash: '4 3',  offset: 6   },
        { t: fcsTime,   label: 'FC',     dash: '5 4',  offset: 6   },
        { t: fceTime,   label: 'FCe', dash: '3 4',  offset: 6   },
        { t: totalTime, label: 'Drop',            dash: 'none', offset: -32 },
      ].filter(m => m.t != null && m.t >= 0);

      return `
        <div class="chart-wrap">
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Roast curve">

            <!-- Phase shading (drawn first, behind everything) -->
            ${phases.map(p => `
              <rect
                x="${x(p.start).toFixed(2)}"
                y="${pad.top}"
                width="${(x(p.end) - x(p.start)).toFixed(2)}"
                height="${innerH}"
                fill="${p.color}"
              />
              <text
                class="axis-text"
                x="${((x(p.start) + x(p.end)) / 2).toFixed(2)}"
                y="${pad.top - 6}"
                text-anchor="middle"
                style="font-size:9px;fill:#7a7670;letter-spacing:0.1em;text-transform:uppercase;"
              >${p.label}</text>
            `).join('')}

            <!-- Y grid lines -->
            ${yTicks.map(tick => `
              <line class="grid" x1="${pad.left}" y1="${y(tick)}" x2="${width - pad.right}" y2="${y(tick)}"></line>
              <text class="axis-text" x="${pad.left - 8}" y="${y(tick) + 4}" text-anchor="end">${tick}</text>
            `).join('')}

            <!-- X grid lines + time labels -->
            ${xTicks.map(tick => `
              <line class="grid" x1="${x(tick)}" y1="${pad.top}" x2="${x(tick)}" y2="${bot}"></line>
              <text class="axis-text" x="${x(tick)}" y="${height - 10}" text-anchor="middle">${Math.round(tick / 60)}m</text>
            `).join('')}

            <!-- Axes -->
            <line class="axis" x1="${pad.left}" y1="${bot}" x2="${width - pad.right}" y2="${bot}"></line>
            <line class="axis" x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${bot}"></line>
            <line class="axis" x1="${width - pad.right}" y1="${pad.top}" x2="${width - pad.right}" y2="${bot}"></line>

            <!-- RoR right axis ticks -->
            ${rorTicks.map(tick => `
              <text class="axis-text" x="${width - pad.right + 6}" y="${yRor(tick) + 4}" text-anchor="start" style="fill:#b0a090;">${tick}</text>
            `).join('')}
            <text class="axis-text" x="${width - 10}" y="${height / 2}" text-anchor="middle" transform="rotate(90 ${width - 10} ${height / 2})" style="fill:#b0a090;">Rate of Rise (°F/min)</text>

            <!-- Phase vertical markers -->
            ${vLines.map(m => `
              <line
                stroke="var(--muted)"
                stroke-width="1"
                stroke-dasharray="${m.dash === 'none' ? '' : m.dash}"
                fill="none"
                x1="${x(m.t).toFixed(2)}" y1="${pad.top}"
                x2="${x(m.t).toFixed(2)}" y2="${bot}"
              />
              <text
                class="axis-text"
                x="${(x(m.t) + m.offset).toFixed(2)}"
                y="${(pad.top + 20).toFixed(2)}"
                style="font-size:9px;fill:#7a7670;"
              >${m.label}</text>
            `).join('')}

            <!-- Rate of Rise curve -->
            <path
              d="${rorPath}"
              fill="none"
              stroke="#c4a882"
              stroke-width="1.5"
              stroke-dasharray="6 3"
            />

            <!-- Bean temp curve -->
            <path class="curve" d="${path}"></path>

            <!-- Axis labels -->
            <text class="axis-text" x="${width / 2}" y="${height - 2}" text-anchor="middle">Time</text>
            <text class="axis-text" x="14" y="${height / 2}" text-anchor="middle" transform="rotate(-90 14 ${height / 2})">Bean temp (°F)</text>

          </svg>

          <div class="chart-note" style="margin-top:6px;">Bean temperature over roast duration. Shaded regions show roast phases.</div>
        </div>`;
    }

    const HERO_KEYS = ['country', 'region', 'subregion', 'processing', 'elevation', 'cultivar', 'flavor'];

    function renderHero(coffee, batchId, roastDate) {
      const chips = String(coffee.flavor || '').split(',').map(f => f.trim()).filter(Boolean)
        .map(f => `<span class="hero-chip">${esc(f)}</span>`).join('');
      const stat = (label, value, full) => value
        ? `<div class="hero-stat${full ? ' full' : ''}"><div class="hero-stat-label">${label}</div><div class="hero-stat-value">${esc(value)}</div></div>`
        : '';
      return `
        <header class="hero">
          <div class="hero-eyebrow">
            <span>Batch ${esc(batchId)}</span>
            <span>Roasted ${esc(roastDate)}</span>
          </div>
          <h2 class="hero-title">${esc(coffee.country || '')}</h2>
          ${coffee.region ? `<div class="hero-region">${esc(coffee.region)}</div>` : ''}
          ${coffee.subregion ? `<div class="hero-loc">${esc(coffee.subregion)}</div>` : ''}
          ${chips ? `<div class="hero-chips">${chips}</div>` : ''}
          <div class="hero-stats">
            ${stat('Processing', coffee.processing)}
            ${stat('Elevation', coffee.elevation)}
            ${stat('Cultivar', coffee.cultivar, true)}
          </div>
        </header>`;
    }

    function renderRecord(r, batchId, coffee) {
      const c = r.computed;
      const weightLoss = c.weight_loss != null ? c.weight_loss.toFixed(1) : '—';
      const devTime = (c.totaltime && c.FCs_time)
        ? secondsToMinSec(c.totaltime - c.FCs_time)
        : '—';

      resultEl.innerHTML = `
        <article class="record">
          ${coffee ? renderHero(coffee, batchId, formatDate(r.roastisodate)) : `
          <div class="record-header">
            <div>
              <div class="record-id">${batchId}</div>
              <div class="record-date">Roast record</div>
            </div>
            <div class="record-date">Roasted ${formatDate(r.roastisodate)}</div>
          </div>`}

          ${coffee && OriginMap.findCoords(coffee) ? `
          <div class="origin-map-wrap">
            <div class="origin-map-label">Where it grew</div>
            <div id="origin-map" class="origin-map" role="img" aria-label="Map of the farm location"></div>
          </div>` : ''}

          <div class="record-grid">

            ${renderCoffee(coffee, HERO_KEYS)}

            <section>
              <div class="section-title">Roast</div>
              ${renderRows([
                { label: 'Total time',  value: c.totaltime != null ? secondsToMinSec(c.totaltime) : '—' },
                { label: 'First crack', value: c.FCs_time  != null ? secondsToMinSec(c.FCs_time)  : '—' },
                { label: 'Development', value: devTime },
                { label: 'Weight loss', value: `${weightLoss} %` },
              ])}
            </section>

            <section class="full">
              <div class="section-title">Roast Curve</div>
              ${renderChart(r.timex, r.temp2, r.timeindex, c)}
            </section>

          </div>
        </article>`;

      renderMap(coffee);
    }

    function renderEmpty() {
      resultEl.innerHTML = '<div class="empty-state">Enter a batch number to view its roast record.</div>';
    }

    function renderError(batch) {
      resultEl.innerHTML = `
        <div class="error-state">
          No record found for <strong>${esc(batch)}</strong>.
          <div class="error-hint">Check the batch number on the bag and try again.</div>
        </div>`;
    }

    function saveBatchCookie(batch) {
      const expires = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toUTCString();
      document.cookie = `lastBatch=${encodeURIComponent(batch)};expires=${expires};path=/`;
    }

    function loadBatchCookie() {
      const match = document.cookie.match(/(?:^|;\s*)lastBatch=([^;]*)/);
      return match ? decodeURIComponent(match[1]) : null;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const batch = normalizeBatch(input.value);
      if (!batch) { renderEmpty(); return; }
      try {
        const { roast, coffee } = await fetchBatch(batch);
        saveBatchCookie(batch);
        renderRecord(roast, batch, coffee);
      } catch (err) {
        renderError(batch);
      }
    });

    const params = new URLSearchParams(window.location.search);
    const presetBatch = normalizeBatch(params.get('batch') || '');
    const cookieBatch = loadBatchCookie();
    const initialBatch = presetBatch || cookieBatch || '';

    if (initialBatch) {
      input.value = initialBatch;
      fetchBatch(initialBatch).then(({ roast, coffee }) => renderRecord(roast, initialBatch, coffee)).catch(() => renderError(initialBatch));
    } else {
      renderEmpty();
    }
  </script>
</body>
</html>
